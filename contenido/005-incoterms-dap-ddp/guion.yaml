descripcion: |
  ¿Qué Incoterm le puede comer toda la ganancia al vendedor? Según las reglas Incoterms® 2020 de la ICC:
  · DAP (Delivered at Place): el vendedor lleva la carga hasta el lugar de destino convenido, lista para descargar. Ahí pasa el riesgo. La descarga, el despacho de importación y los impuestos son del comprador.
  · DDP (Delivered Duty Paid): igual que DAP, pero el vendedor además despacha y paga la importación: aranceles, impuestos y trámites en el país del comprador. Es el Incoterm de máxima obligación para el vendedor.

  Ojo: si en el país de destino la ley exige que el importador sea local, DDP no se puede usar y corresponde DAP.

  Imágenes de stock: Ivan Mudruk, Glenn Langhorst, Eric Skaggs, Tima Miroshnichenko y Cyriac von Czapiewski (Pexels).

