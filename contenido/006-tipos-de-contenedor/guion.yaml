descripcion: |
  ¿Todos los contenedores son iguales? No. Seis tipos y para qué sirve cada uno:
  · Dry (estándar): caja cerrada para carga general.
  · High cube: 9'6" de alto exterior (2,896 m) contra 8'6" (2,591 m) del estándar: un pie más, para carga voluminosa.
  · Reefer: refrigerado. Los de Hapag-Lloyd controlan de -35 °C a +30 °C.
  · Open top: techo de lona removible, se carga desde arriba con grúa. Para carga alta.
  · Flat rack: sin techo ni paredes laterales, para cargas pesadas o sobredimensionadas, como maquinaria.
  · Tanque: líquidos (alimentos o químicos). Se llena al menos al 80 % para evitar el oleaje interno durante el viaje.

  Fuentes: especificaciones de contenedores de Hapag-Lloyd y Maersk.

  Imágenes de stock: Cyriac von Czapiewski, Rolan Muradov, Mike Hongkong 2, FÁBIO REIS DE ABREU, Glenn Langhorst e Ivan Mudruk (Pexels).

