descripcion: |
  ¿Un contenedor de 40 pies carga el doble que uno de 20? En volumen sí; en peso, no.
  · TEU (Twenty-foot Equivalent Unit): un contenedor de 20 pies es 1 TEU; uno de 40 (FEU) cuenta como 2 TEU. Así se mide la capacidad de un barco: el MSC Irina (2023) tiene 24.346 TEU.
  · 20' estándar (Hapag-Lloyd): 33,2 m³ y hasta 30.200 kg de carga.
  · 40' estándar (Hapag-Lloyd): 67,7 m³ y hasta 28.800 kg de carga. Los dos tienen 32.500 kg de peso bruto máximo, pero el 40' pesa más vacío (3.700 kg contra 2.300 kg).
  · La cuenta: peso de tu carga ÷ volumen. 28.800 kg ÷ 67,7 m³ ≈ 425 kg/m³. Si tu carga es más densa, el 40' se queda sin peso antes de llenarse: conviene el de 20.

  Ojo: la carga máxima varía según el contenedor (está en su placa) y en la ruta pueden regir límites de peso menores. Consultalo con tu naviera o transportista antes de reservar.

  Fuentes: especificaciones de contenedores de Hapag-Lloyd, CBS (definición de TEU) y The Maritime Executive.

  Imágenes de stock: Cyriac von Czapiewski, Mike Hongkong 2, FÁBIO REIS DE ABREU, Glenn Langhorst y Eric Skaggs (Pexels).

