descripcion: |
  BILL OF LADING: si lo perdés, pagás el doble 📄

  📘 Guía práctica + planilla para comparar cotizaciones: https://go.hotmart.com/M108343404O?dp=1 (con el cupón LANZAMIENTO la pagás USD 5, hasta el 18/11)

  El Bill of Lading (B/L o conocimiento de embarque) original no es un papel más: es recibo de la carga, prueba del contrato de transporte y título de la mercadería. Quien presenta el original tiene derecho a reclamar la carga en destino.
  · Se emite normalmente en un juego de tres originales. Con uno se retira la carga y los otros quedan anulados ("one of which being accomplished, the others to stand void"). Por eso se controla el juego completo.
  · Si se pierde, la naviera no entrega sin una carta de indemnidad con garantía bancaria. Ejemplos: Swire Shipping pide una garantía del 200 % del valor CIF; Maersk en Indonesia pide en general el 300 % del valor de la carga.
  · La jugada: si le comprás seguido al mismo proveedor y no pagás con carta de crédito, pedí sea waybill o telex release. El sea waybill no es título: la naviera entrega al destinatario nombrado sin originales.
  · Si es un negocio nuevo o pagás con carta de crédito, B/L original y bien guardado.

  Ojo: las exigencias cambian según la naviera y el país. Consultá siempre con tu naviera o forwarder.

  Fuentes: Maersk y DCSA (B/L vs. sea waybill), Swire Shipping (B/L perdido), Maersk Indonesia (hoja de información para B/L perdido) y The Maritime Executive (por qué se emiten tres originales).

  Seguí Logística en 1 Minuto: un concepto nuevo cada día.

