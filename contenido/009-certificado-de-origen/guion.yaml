descripcion: |
  CERTIFICADO DE ORIGEN: sin él, pagás arancel 📜

  📘 Guía práctica + planilla para comparar cotizaciones: https://go.hotmart.com/M108343404O?dp=1 (con el cupón LANZAMIENTO la pagás USD 5, hasta el 18/11)

  Si le comprás a un país con el que hay un acuerdo comercial (por ejemplo, entre socios del Mercosur), la rebaja de arancel no es automática: hay que probar que el producto es originario. Esa prueba es el certificado de origen. Sin una prueba de origen válida, la aduana no aplica la preferencia arancelaria.
  · Régimen de Origen Mercosur (Decisión CMC 05/23, vigente desde el 18/07/2024): el certificado se emite dentro de los 180 días desde la factura comercial (antes eran 60) y vale 12 meses desde su emisión (antes, 180 días).
  · Antes de que salga la carga, pedile al proveedor una copia y comparala con la factura comercial: la descripción del producto y el código arancelario tienen que coincidir.
  · Si la aduana detecta un error: en Argentina se pide un certificado nuevo, el importador deja una garantía y tiene 30 días corridos para presentarlo.
  · Novedad: el régimen nuevo permite que cada país habilite también una declaración de origen hecha por el propio exportador. Argentina lo hizo con la Resolución 247/2026 (vigente desde el 26/09/2026): esa declaración indica número y fecha de la factura comercial.

  Ojo: los procedimientos cambian según el país y el acuerdo. Consultá con tu despachante de aduana.

  Fuentes: Centro Despachantes de Aduana de Argentina (CDA, comunicaciones sobre el nuevo Régimen de Origen Mercosur), Aduana News, Dirección Nacional de Aduanas de Uruguay (Comunicado 60/2024) y Resolución 247/2026 de Argentina.

  Seguí Logística en 1 Minuto: un concepto nuevo cada día.

