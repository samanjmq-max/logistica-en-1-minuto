descripcion: |
  AVERÍA GRUESA: tu carga llegó sana y pagás igual ⚓

  📘 Guía práctica + planilla para comparar cotizaciones: https://go.hotmart.com/M108343404O?dp=1 (con el cupón LANZAMIENTO la pagás USD 5, hasta el 18/11)

  Avería gruesa: si en el viaje se hace un gasto o sacrificio extraordinario para salvar barco y carga (combatir un incendio, pagar un salvamento), el costo se reparte entre todos los intereses del viaje, aunque tu mercadería llegue intacta. Lo rigen las Reglas de York-Amberes (revisión 2016), incluidas en el conocimiento de embarque.
  · Sin garantía, la carga no se libera.
  · Caso real: Maersk Honam (incendio, 2018): 42,5 % de garantía de salvamento + 11,5 % de avería gruesa = 54 % del valor de la carga, también para contenedores sanos.
  · Sin seguro: firmás el Average Bond y dejás un depósito en efectivo (un % del valor CFR que fija el liquidador). Puede quedar inmovilizado meses o años.
  · Con seguro: la aseguradora firma la Average Guarantee (vos no) y vos firmás solo el Average Bond.
  · Hoy: confirmá por escrito que tu póliza cubre avería gruesa y salvamento (en las Cláusulas del Instituto A, B y C 2009 es la cláusula 2). Si se declara, avisá enseguida a tu aseguradora.

  Fuentes: MSC (aviso del 15/05/2018), The Loadstar, Supply Chain Dive, Sedgwick, C.H. Robinson y Cláusulas del Instituto 2009.

  Seguí Logística en 1 Minuto: un concepto nuevo cada día.

  Curso recomendado de logística internacional (link de afiliado): https://go.hotmart.com/M108343505U

  Imágenes de stock: Ivan Mudruk, Glenn Langhorst, Tima Miroshnichenko, Kampus Production y Mikhail Nilov (Pexels).

