descripcion: |
  SEGURO CIF: si te roban la carga, no te paga 🚨

  📘 Guía práctica + planilla para comparar cotizaciones: https://go.hotmart.com/M108343404O?dp=1 (con el cupón LANZAMIENTO la pagás USD 5, hasta el 18/11)

  Seguro de carga: cláusulas A, B y C (Institute Cargo Clauses).
  · En CIF (Incoterms 2020) el vendedor solo está obligado a contratar la cobertura mínima: cláusula C, por el 110 % del valor del contrato. En CIP, desde 2020, el mínimo es la cláusula A.
  · Cláusula C: incendio o explosión, varada o hundimiento, vuelco o descarrilamiento del transporte terrestre, choque, descarga en puerto de arribada forzosa, avería gruesa y echazón. NO cubre robo, ni entrada de agua de mar o de río, ni caída al mar desde cubierta.
  · Cláusula B: suma agua de mar o de río, caída al mar desde cubierta, terremoto y rayo; el robo sigue sin cobertura.
  · Cláusula A ("todo riesgo"): incluye robo y daños no excluidos expresamente.
  · Ninguna cubre: embalaje insuficiente o inadecuado, vicio propio de la mercadería, demora, mermas o derrames normales. Guerra y huelgas van aparte.
  · Hoy: si comprás CIF, pedí por contrato cobertura cláusula A (la cobertura extra corre por cuenta del comprador) o comprá FOB y asegurá vos. Y revisá el embalaje: ninguna cláusula cubre el daño por embalaje insuficiente.

  Fuentes: ICC Academy, Röhlig (Incoterms 2020: CIF) y MSIG (comparación ICC A, B y C).

  Seguí Logística en 1 Minuto: un concepto nuevo cada día.

  Curso recomendado de comercio exterior (link de afiliado): https://go.hotmart.com/P108344299F

