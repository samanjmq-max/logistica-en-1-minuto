descripcion: |
  DEMURRAGE DETENTION: la multa que corre por día ⏰

  📘 Guía práctica + planilla para comparar cotizaciones: https://go.hotmart.com/M108343404O?dp=1 (con el cupón LANZAMIENTO la pagás USD 5, hasta el 18/11)

  Dos cargos que cobra la naviera cuando te pasás de los días libres (free time):
  · Demurrage: el contenedor lleno sigue dentro del puerto o terminal. En importación corre desde la descarga del barco.
  · Detention: el contenedor está afuera (en tu depósito o en un camión). Corre desde que sale del puerto hasta que entra VACÍO al depósito que indica la naviera. Descargar la mercadería no frena el reloj.
  · Algunas navieras dan días separados y otras días combinados (demurrage + detention juntos).
  · Dato: con 14 días de más, el promedio por contenedor estándar era USD 2.478 en Nueva York y USD 584 en Hamburgo (Container xChange, 2023).
  · Hoy: antes de embarcar, pedí por escrito cuántos días libres tenés, si son separados o combinados y desde cuándo corren; negocialos antes de reservar. Tené los papeles de aduana listos antes de que llegue el barco y devolvé el vacío apenas lo descargues.

  Las condiciones las define cada naviera en su tarifa y en tu contrato: confirmalas con tu forwarder.

  Fuentes: términos de Maersk para Detention & Demurrage y benchmark de Container xChange 2023.

  Seguí Logística en 1 Minuto: un concepto nuevo cada día.

