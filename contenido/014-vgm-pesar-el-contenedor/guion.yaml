descripcion: |
  PESO VGM: sin este número, tu contenedor no sube ⚖️

  ¿Exportás en contenedor? Desde el 1/7/2016 (convenio SOLAS de la OMI), un contenedor lleno no se carga en el barco sin su VGM, el peso bruto verificado. Lo declara y firma el embarcador (el shipper del conocimiento de embarque) antes del cierre que fija la naviera o el forwarder, que cambia según el puerto.
  · Método 1: pesar el contenedor ya cargado, en una balanza calibrada.
  · Método 2: pesar toda la carga con sus embalajes, pallets, maderas de estiba y trincas, y sumar la tara del contenedor (figura en la puerta, "TARE").
  · Estimar el peso no está permitido.
  · El error típico: mandar solo el peso de la mercadería. El VGM es mercadería + embalajes + contenedor.
  · Que coincida con lo que declaraste: Maersk anunció en 2020, para cargas desde Reino Unido, un cargo de GBP 100 por contenedor si el VGM difiere más de ±500 kg o 5 % del peso de las instrucciones de embarque más la tara.

  Ojo: los plazos, tolerancias y cargos varían según el país, el puerto y la naviera, y en algunos países el método 2 exige que el exportador esté registrado ante la autoridad. Confirmalo al reservar.

  Seguí Logística en 1 Minuto: un concepto nuevo cada día.

