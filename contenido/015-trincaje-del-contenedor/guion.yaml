descripcion: |
  TRINCAJE CASERO: llegó roto y el seguro no paga ⛓️

  📘 Guía práctica + planilla para comparar cotizaciones: https://go.hotmart.com/M108343404O?dp=1

  Trincaje (sujeción de la carga) dentro del contenedor: si lo cargás vos, la responsabilidad es tuya.
  · Seguro: en las Cláusulas del Instituto (A) 2009, cláusula 4.3, no se cubre el daño por embalaje insuficiente cuando lo hizo el asegurado o su personal, y "embalaje" incluye la estiba en el contenedor. Si la estiba la hace otro, pedí que quede por escrito quién la hizo.
  · Fuerzas (Código CTU de la OMI, la OIT y la CEPE): en mar abierto la carga empuja de costado con hasta 0,8 de su peso; en ruta, al frenar, 0,8 hacia adelante.
  · Anclajes: cada punto del piso del contenedor tiene una carga mínima de 1.000 kg (10 kN) en cualquier dirección (muchos nuevos, 2.000 kg); los del techo, 500 kg. Una máquina de 2.000 kg puede empujar 1.600 kg de costado: un solo amarre no alcanza.
  · Huecos: la suma de espacios libres en cada dirección horizontal no debería pasar de 15 cm; se rellenan con bolsas de aire o madera.
  · Peso: el centro de gravedad no debería correrse más de un 5 %; como regla práctica, no más del 60 % del peso en la mitad del largo.

  Seguí Logística en 1 Minuto: un concepto nuevo cada día.

  Curso recomendado de logística internacional (link de afiliado): https://go.hotmart.com/M108343505U

