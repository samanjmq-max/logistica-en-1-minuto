  se_lleva: "Si carga el contenedor él mismo, el seguro no cubre el daño por mala estiba: tiene que amarrar con la cuenta del CTU Code (la carga empuja hasta 0,8 de su peso; cada anclaje del piso aguanta como mínimo 1.000 kg), dejar en total no más de 15 cm de huecos por dirección y no poner más del 60 % del peso en la mitad del largo."
  util: 4
  llamativo: 5
  gancho: "Cargaste vos el contenedor, llegó roto y el seguro no te paga."
  aprendi: "Para las Cláusulas del Instituto (A) 2009, 'embalaje' incluye la estiba dentro del contenedor: si la hizo el asegurado o su gente, el daño por mala estiba queda excluido incluso en 'todo riesgo'. Y la cuenta no da con una sola argolla: una máquina de 2.000 kg en mar abierto empuja de costado hasta 1.600 kg, y cada anclaje del piso solo garantiza 1.000 kg."
  referencia: "Mecanismos de la regla 22 (sin copiar texto): plata que perdés con contraste en los primeros 3 s (tenías seguro y no paga), desmentir lo que creés ('con la cláusula A estoy cubierto') y números concretos en pantalla (0,8 · 1.000 kg · 15 cm). En la búsqueda de la semana lo que circula del tema son videos de cargas que casi vuelcan: consecuencia visible primero, explicación después. vidIQ sin créditos hasta el 30/11: referencia por WebSearch, sin TubeAlfred."
