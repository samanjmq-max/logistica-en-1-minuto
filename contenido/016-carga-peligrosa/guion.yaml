descripcion: |
  CARGA PELIGROSA: era perfume y pagás 5.000 💸

  📘 Guía práctica + planilla para comparar cotizaciones: https://go.hotmart.com/M108343404O?dp=1

  Mucha mercadería de todos los días es "mercancía peligrosa" para el transporte, y declararla como carga común se paga caro.
  · Dato: Maersk cobra como base USD 5.000 por conocimiento de embarque (BL) mal declarado; en China, USD 15.000 por contenedor, más todos los costos que genere (aviso de Maersk del 24/10/2025).
  · Ejemplos: el perfume con solvente inflamable (alcohol) es UN 1266, clase 3 (líquido inflamable); las baterías de litio son clase 9.
  · Qué hacer: antes de comprar, pedile al proveedor la ficha de datos de seguridad (SDS). En la sección 14 ("Información relativa al transporte") figuran el número ONU, la clase y el grupo de embalaje. Si trae número ONU y clase, avisale a tu forwarder antes de reservar: necesita la declaración de mercancías peligrosas según el código IMDG.
  · Contexto: TT Club estima que hasta un 10 % de la carga es peligrosa y que otro 5 % viaja mal declarado o mal clasificado.

  Seguí Logística en 1 Minuto: un concepto nuevo cada día.

  Curso recomendado de logística internacional (link de afiliado): https://go.hotmart.com/M108343505U

  Imágenes de stock: Glenn Langhorst, Tima Miroshnichenko, Liza Summer, Mikhail Nilov y Katrin Bolovtsova (Pexels).

