descripcion: |
  CONTENEDOR REFRIGERADO: no enfría tu carga ❄️

  El error: pensar que el contenedor refrigerado (reefer) funciona como una cámara que enfría. No: está hecho para mantener la temperatura que tenía la carga cuando se cargó.
  · Dato: West P&I cuenta el caso de un producto congelado cargado a unos -5 °C que tardó más de 3 días en llegar a -18 °C en el centro. Según el club, el reefer baja la temperatura de una carga tibia solo "extremadamente despacio".
  · Qué hacer: preenfriá la carga a la temperatura de viaje antes de cargar (lo piden MSC, Kuehne+Nagel y TT Club) y medila antes de que entre al contenedor.
  · Ojo con la escala: según TT Club, confundir Celsius con Fahrenheit está entre las causas más comunes de reclamos. 0 °C es una temperatura típica de enfriado; 0 °F (unos -18 °C), de congelado. Hubo pan y chocolate que viajaron congelados por errores así.
  · Hoy mismo: poné temperatura y escala (°C o °F) por escrito en la reserva y en las instrucciones al forwarder. Definirlas es responsabilidad del que envía.
  · Al cargar: nunca por encima de la línea roja ni más allá del piso de rieles (T-floor), para que circule el aire.

