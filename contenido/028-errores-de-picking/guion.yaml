descripcion: |
  PICKING EQUIVOCADO: pagás 3 envíos por un pedido 📦

  📗 Guía + planilla para armar tu primer depósito: https://go.hotmart.com/U108348887Q?dp=1

  Problema: el pedido sale con el producto, el talle o el color equivocado. El error se paga con el envío de ida, la devolución y el reenvío.
  · Dato: en el informe DC Measures 2025 de WERC (Warehousing Education and Research Council), el 20 % de depósitos con mejor desempeño arranca en 99,68 % de acierto en la preparación de pedidos: hasta unos 3 pedidos mal de cada 1.000.
  · Causa típica: productos parecidos (talles, colores, versiones) guardados uno al lado del otro, con etiquetas que se confunden.
  · Solución 1: separá los parecidos en ubicaciones que no sean vecinas y usá etiquetas bien distintas.
  · Solución 2: poné un dígito de control (un código corto) en la etiqueta de cada ubicación. El que prepara lo dice (picking por voz) o lo escanea antes de sacar: así confirma que está en el lugar correcto.
  · Error a evitar: dejar siempre los mismos dígitos. El personal los memoriza rápido y confirma sin mirar; cambialos cada tanto.

  Seguí Logística en 1 Minuto: un concepto nuevo cada día.

  Imágenes de stock de Pexels: Liza Summer, Rolan Muradov y otros autores (enlaces en el guion del video en github.com/samanjmq-max/logistica-en-1-minuto).

