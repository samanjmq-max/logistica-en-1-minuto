  gancho: "Despachaste primero lo que entró primero, y igual tiraste mercadería vencida."
  aprendi: "La mercadería 'vence' para el cliente mucho antes de la fecha impresa: en Japón, con la regla del tercio, el fabricante tiene que entregar dentro del primer tercio de la vida útil (en un producto de 6 meses, dentro de 2) o el comercio no la recibe, y el Ministerio de Agricultura la señala como una de las causas de pérdida de alimentos. Y el FIFO 'de manual' falla porque un lote que entra hoy puede vencer antes que el que ya está guardado: por eso la OMS pide FEFO (TRS 1025, anexo 7, 12.30)."
  referencia: "Mecanismos de la regla 22 (sin copiar texto): desmentir lo que te enseñaron (FIFO = primero lo que entró), plata que perdés con contraste en los primeros 3 s (hiciste todo bien y tiraste igual), número concreto en pantalla (regla de 1/3) y objeto visible en el primer cuadro (producto en estantería). Estructura de la serie 2: problema → causa → solución. vidIQ sin créditos (se renuevan el 30/11): referencia por WebSearch; en el nicho hispano, FIFO/FEFO aparece sobre todo como definición en LinkedIn y blogs, no como problema con consecuencia, y ese es el hueco."
