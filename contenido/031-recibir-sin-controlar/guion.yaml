descripcion: |
  REMITO FIRMADO: pagaste lo que no llegó 📦

  📗 Guía + planilla para armar tu primer depósito: https://go.hotmart.com/U108348887Q?dp=1 (con el cupón DEPOSITO7 la pagás USD 7, hasta el 18/11)

  Problema: se paga mercadería que nunca entró al depósito.
  · Causa: se firma el remito (albarán o guía) sin contar, o se cuenta contra el papel del proveedor en vez de la orden de compra propia.
  · Paso 1: antes de firmar, contá bultos y cantidades contra TU orden de compra.
  · Paso 2: si falta algo o llega golpeado, anotalo en el remito en ese momento.
  · Dato: en transporte internacional por carretera (Convenio CMR, art. 30), el daño visible se reserva al momento de la entrega; el que no se ve, por escrito dentro de los 7 días (sin domingos ni feriados); la demora, dentro de los 21 días. En otros transportes y países los plazos cambian: revisá tu contrato.
  · Paso 3: pagá la factura solo si coincide con la orden de compra y con lo recibido (cruce de 3 documentos o "three-way match").

  Seguí Logística en 1 Minuto: un concepto nuevo cada día.

  Imágenes de stock: Mizuno K, Liza Summer, Kampus Production y Katrin Bolovtsova (Pexels).

