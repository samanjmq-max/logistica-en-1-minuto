descripcion: |
  CARGA SUELTA: la cincha dice 2.000 y aprieta 500 🚚

  Problema: amarraste la carga del camión con cinchas "de 2.000 kg", frenaste y la carga se corrió igual.
  · Causa: al frenar, la carga empuja hacia adelante con hasta 0,8 de su peso (0,5 de costado y hacia atrás), según las Guías Europeas de Buenas Prácticas para la sujeción de cargas en carretera (2014, norma EN 12195-1).
  · La etiqueta: el número grande es el LC (capacidad de amarre). En el amarre por encima de la carga, la guía dice que el LC es irrelevante: la cincha solo aprieta hacia abajo su STF (tensión con la carraca), que en cincha de 50 mm suele ir de 250 a 500 daN (1 daN ≈ 1 kg).
  · Paso 1: alfombra de goma antideslizante bajo la carga (con superficie limpia, la guía toma fricción 0,6).
  · Paso 2: cargá pegado al frente del camión, sin huecos. Un frente EN 12642 L (5.000 daN) bloquea 7,8 t con fricción 0,15 y 25,4 t con 0,6. Si queda un hueco, todo el peso lo tienen que sujetar las cinchas.
  · Error a evitar: calcular las cinchas con el LC cuando las pasás por encima.

  Seguí Logística en 1 Minuto: un problema real y cómo se resuelve, cada día.

