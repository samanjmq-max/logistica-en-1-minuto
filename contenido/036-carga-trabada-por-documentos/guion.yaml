descripcion: |
  CARGA TRABADA: el dato que no coincide 📄

  📘 Guía práctica + planilla para comparar cotizaciones: https://go.hotmart.com/M108343404O?dp=1 (con el cupón LANZAMIENTO la pagás USD 5, hasta el 18/11)

  Problema: la carga llega y no la liberan porque los papeles no dicen lo mismo.
  · Causa: factura comercial, packing list y conocimiento de embarque (BL) con distinta cantidad de bultos, distinto peso o una descripción genérica ("repuestos", "muestras").
  · Dato: en EE. UU. (19 CFR 141.86) la factura debe nombrar cada artículo y decir qué va en cada bulto; si no trae el peso que hace falta para calcular el arancel, el importador paga el pesaje antes de la liberación.
  · Dato: corregir el BL tarde se cobra. Maersk cobra EUR 50 por BL en exportaciones desde Europa si el cambio se pide 1 día o más después de cargar el contenedor (desde el 15/10/2026); en otros orígenes, como China, el cargo puede aplicar ya después de emitido el borrador.
  · Hoy: pedí los borradores de los tres papeles antes del embarque, cruzá bultos, peso bruto y descripción línea por línea, y corregí antes de que carguen.

  Los requisitos exactos dependen de la aduana de cada país: confirmalos con tu despachante.

  Seguí Logística en 1 Minuto: un concepto nuevo cada día.

