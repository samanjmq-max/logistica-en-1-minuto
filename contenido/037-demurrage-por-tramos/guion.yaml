descripcion: |
  DEMURRAGE POR TRAMOS: calculaste 3.900 y pagás 4.700 💸

  📘 Guía práctica + planilla para comparar cotizaciones: https://go.hotmart.com/M108343404O?dp=1

  El demurrage (contenedor lleno que sigue en la terminal después de los días libres) no se cobra a un precio fijo por día: sube por tramos.
  · Ejemplo real: tarifa de importación de Maersk vigente desde el 1/1/2026 para las terminales de Nueva York y Nueva Jersey, contenedor seco de 20 o 40 pies: días 1 a 4 libres; días 5 a 8, USD 390 por día; 9 a 13, USD 500; 14 a 33, USD 640; desde el día 34, USD 745.
  · 10 días de más (días 5 a 14): 4 × 390 + 5 × 500 + 1 × 640 = USD 4.700. Con el precio del primer día habrías calculado USD 3.900.
  · En esa tarifa los días libres son días hábiles (lunes a sábado con el portón abierto), pero lo que se pasa se cobra por día calendario.
  · Qué hacer hoy: antes de embarcar, pedile a tu forwarder la tabla de tramos de TU puerto y naviera, por escrito. Calculá el peor caso sumando los días que puede demorar la aduana. Si vas a necesitar más tiempo, negociá días libres extra antes de que llegue el barco (Hapag-Lloyd, por ejemplo, vende hasta 10 días extra de detention con descuento, que se pagan antes del arribo y no se devuelven).

  Cada naviera y cada puerto tienen su propia tabla, y la tarifa pública de la naviera es la que vale: confirmala antes de cerrar.

  Seguí Logística en 1 Minuto: un concepto nuevo cada día.

  Curso recomendado de logística internacional (link de afiliado): https://go.hotmart.com/M108343505U

