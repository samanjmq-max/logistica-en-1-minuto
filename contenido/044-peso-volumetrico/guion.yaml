descripcion: |
  PESO VOLUMÉTRICO: tu caja de 5 kg paga 12 📦

  ¿Por qué te cobran más de lo que pesa tu caja? Por el peso volumétrico: las empresas de envío cobran también el espacio que ocupa el paquete.
  · La cuenta (courier express): largo × ancho × alto en centímetros ÷ 5000 = kilos volumétricos. Es el divisor habitual de DHL Express y UPS (para DHL, 1 m³ = 200 kg).
  · Se compara con el peso real y se cobra el MAYOR de los dos. Ejemplo de DHL: una caja de 50 × 40 × 30 cm que pesa 5 kg se cobra como 12 kg.
  · En carga aérea, la regla de IATA usa 6000 cm³ por kilo: la misma caja da 10 kg.
  · UPS además redondea cualquier fracción al siguiente medio kilo.
  · Para pagar menos: usá la caja más chica que proteja bien el producto. Con 50 × 40 × 20 cm, el peso volumétrico baja a 8 kg.

  Ojo: el divisor puede cambiar según la empresa, el servicio y el país. Confirmalo con tu transportista antes de enviar.

  Fuentes: DHL Express (cálculo de peso volumétrico), UPS (dimensiones y peso) y material de capacitación de ASEAN basado en el manual IATA TACT.

  Seguí Logística en 1 Minuto: un concepto nuevo cada día.

