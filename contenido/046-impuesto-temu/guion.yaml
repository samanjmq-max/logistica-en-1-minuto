descripcion: |
  IMPUESTO TEMU: comprás 15 y pagás 20 💸

  📘 Guía práctica + planilla para comparar cotizaciones: https://go.hotmart.com/M108343404O?dp=1

  ¿Cuánto pagás hoy por comprar en el exterior desde Uruguay? Régimen vigente desde el 1/5/2026 (Decreto 50/2026):
  · Franquicia: hasta 3 envíos por persona y por año, con un tope de USD 800 en total en el año. El IVA no entra en ese tope. Lo que no usás no pasa al año siguiente.
  · En franquicia se paga IVA del 22 %. Desde Estados Unidos, hasta USD 200 por envío, no se paga IVA (acuerdo TIFA), pero la mercadería tiene que ser de allá: si en el paquete va algo que no es de EE. UU., paga IVA todo el envío.
  · Cuarto envío, o un envío que no cumple las condiciones: pasa al régimen simplificado, 60 % del valor con un mínimo de USD 20 por envío (máximo 20 kg, sin productos con IMESI).
  · La cuenta: un producto de USD 100 paga USD 22 en franquicia y USD 60 fuera de ella. Uno de USD 15 fuera de franquicia paga el mínimo: USD 20.
  · Qué hacer: cada envío gasta una de tus 3 franquicias, valga USD 5 o USD 700. Juntá las compras chicas en un solo envío y guardá las franquicias para lo que más vale.

  Ojo: las reglas pueden cambiar. Revisá la guía del MEF y la Aduana (DNA) antes de comprar.

  Seguí Logística en 1 Minuto: un concepto nuevo cada día.

  Curso recomendado de comercio exterior (link de afiliado): https://go.hotmart.com/P108344299F

  Imágenes de stock: Tima Miroshnichenko, Liza Summer, Mizuno K y Mikhail Nilov (Pexels).

