descripcion: |
  ESTANTERÍA INDUSTRIAL: subís un nivel y aguanta 38 % menos ⚠️

  📗 Guía + planilla para armar tu primer depósito: https://go.hotmart.com/U108348887Q?dp=1

  Duda: ¿puedo separar los niveles de la estantería para que entren pallets más altos?
  · Dato: en la tabla de capacidades de Interlake Mecalux para un mismo bastidor (modelo 2.314, uso no sísmico), con niveles cada 48" (1,2 m) aguanta 20.867 lb (9.465 kg) y cada 72" (1,8 m) 12.982 lb (5.888 kg): 38 % menos.
  · Regla: la capacidad la decide el hueco más grande, sea entre dos niveles o del piso al primer larguero. Mover uno solo cambia la capacidad de todo el módulo.
  · Paso 1: antes de mover, sacar o agregar un larguero, pedí la capacidad nueva al fabricante (o a un ingeniero).
  · Paso 2: actualizá el cartel de carga (kilos por nivel y por módulo) antes de volver a cargar.
  · Paso 3: lo más pesado, en los niveles de abajo.
  · Error a evitar: reacomodar niveles "a ojo" y seguir cargando con el cartel viejo.
  Las capacidades son de un modelo de ejemplo: la de tu estantería está en la placa o en la ficha de tu fabricante.

  Seguí Logística en 1 Minuto: un concepto nuevo cada día.

