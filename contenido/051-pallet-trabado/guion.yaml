  gancho: "Cruzaste las cajas del pallet para que quede más firme, y las de abajo llegaron aplastadas."
  aprendi: "Lo que muchos enseñan como la forma correcta (trabar o cruzar las capas) le quita a las cajas entre 49 y 54 % de su resistencia a la compresión, contra 12 a 20 % en columna (RIT para la Fibre Box Association, 2021). Y una columna corrida apenas 1,9 cm ya pierde 44 a 45 %, casi lo mismo que cruzar. Además, 2,5 cm de caja afuera del pallet le sacan a una capa entre 14 y 28 % (Virginia Tech)."
  referencia: "Mecanismos de la regla 22 (sin copiar texto): desmentir lo que te enseñaron (trabar = más firme), plata que perdés con contraste en los primeros 3 s (más firme, pero se aplasta), número concreto en pantalla (la mitad de la resistencia) y objeto visible en el primer cuadro (pallet), que es lo que repartió Instagram la semana del 16 al 22/11. Estructura de la serie 3: la duda → los pasos → el error a evitar. vidIQ sin créditos (se renuevan el 30/11): referencia por WebSearch, sin TubeAlfred."
