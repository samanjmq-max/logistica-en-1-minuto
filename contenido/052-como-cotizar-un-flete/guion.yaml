descripcion: |
  COTIZAR FLETE: el dato que te sube el precio 🚚

  📘 Guía práctica + planilla para comparar cotizaciones: https://go.hotmart.com/M108343404O?dp=1 (con el cupón LANZAMIENTO la pagás USD 5, hasta el 18/11)

  ¿Te cotizaron un flete y la factura llegó más cara? Casi siempre faltaron datos al pedir el precio. Los 3 que te pide cualquier transportista:
  · 1. Origen y destino: direcciones o puertos, si es puerta a puerta o puerto a puerto, y el Incoterm (define qué tramos se cotizan). En rutas cortas, el tramo por tierra puede costar más que el barco.
  · 2. Qué mercadería es, y si es peligrosa (baterías, químicos, aerosoles).
  · 3. Bultos, medidas (largo × ancho × alto), peso bruto y si se pueden apilar. La carga que no se apila paga el espacio que queda libre arriba.
  · El dato que cambia el precio: en marítimo consolidado (LCL) se cobra por "W/M": 1 m³ equivale a 1.000 kg y se paga lo que sea mayor. Ejemplo: 2 m³ que pesan 300 kg pagan por 2 m³.
  · Pedí siempre el precio todo incluido ("all in") y desglosado, así comparás cotizaciones iguales.

  Ojo: en aéreo y camión la equivalencia es otra (ver nuestro video de peso volumétrico) y cada transportista puede tener mínimos propios. Confirmalo al cotizar.

  Seguí Logística en 1 Minuto: un concepto nuevo cada día.

  Curso recomendado de logística internacional (link de afiliado): https://go.hotmart.com/M108343505U

  Imágenes de stock: Tima Miroshnichenko, Mike Hongkong 2, Liza Summer, Glenn Langhorst y Mikhail Nilov (Pexels).

