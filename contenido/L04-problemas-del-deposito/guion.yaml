descripcion: |
  📗 Guía + planilla para armar tu primer depósito: https://go.hotmart.com/U108348887Q?dp=1

  El sistema dice 40 cajas y en la estantería hay 31. En este video recorremos un depósito en el orden en que se mueve la mercadería (recibir, guardar, contar, preparar y despachar) con los 10 problemas que más plata hacen perder, qué cuesta cada uno y cómo se resuelve. Además: un ejemplo con números en un depósito de Montevideo, por dónde empezar y los 4 errores más comunes al arreglarlo.

  Los 10 problemas:
  1. Firmar el remito sin contar → contar contra tu orden de compra y anotar en el remito.
  2. Guardar donde hay lugar → dirección para cada hueco (pasillo, módulo, nivel, posición).
  3. Estanterías sin cartel de carga → capacidad por nivel a la vista; lo pesado abajo.
  4. El golpe que nadie vio → semáforo de daños (verde, ámbar, rojo) e inspecciones.
  5. Pallet mal armado → nada fuera del borde, carga pareja, film que abrace la madera.
  6. Stock que no coincide → conteo cíclico A, B, C, a ciegas, buscando la causa.
  7. Mercadería vencida → FEFO: sale primero lo que vence primero.
  8. Lo que más sale, lejos → ordenar por salidas, cerca del despacho y a la altura de la mano.
  9. Pedido equivocado → separar productos parecidos y dígito de control.
  10. Autoelevador sin reglas → pasillos marcados, operadores capacitados, respetar la placa.

  Datos clave:
  · Inventario: en casi 370.000 registros de 37 tiendas de un minorista, el 65 % no coincidía con lo que había (DeHoratius y Raman, Management Science, 2008).
  · Recepción: en el convenio CMR (transporte internacional por carretera), el daño no visible se avisa por escrito dentro de 7 días, sin contar domingos ni feriados (art. 30). Revisá el plazo de tu contrato.
  · Estanterías: semáforo de daños de SEMA. Verde: se usa y se vigila. Ámbar: reparar, sin descarga inmediata; si no se repara en 4 semanas pasa a rojo. Rojo: descargar y sacar de uso de inmediato. Además, inspección técnica de un experto y carteles con la carga máxima.
  · Pallet europeo EPAL: 1.200 × 800 × 144 mm, unos 25 kg; 1.500 kg con carga pareja, 1.000 kg si no lo es.
  · Preparación de pedidos: se estima en hasta el 55 % del costo operativo de un depósito, y el recorrido suele ser la parte más grande del tiempo (de Koster, Le-Duc y Roodbergen, 2007).
  · Pedidos bien preparados: el 20 % de mejor desempeño arranca en 99,68 % (WERC, DC Measures 2025).
  · Autoelevadores en Estados Unidos, 2017: 74 muertes en el trabajo y 9.050 lesiones con días de baja (BLS).
  Ojo: el ejemplo de Montevideo usa números supuestos (2.000 pedidos por mes, 1 % de error, USD 6 por envío). Hacé la cuenta con los tuyos.

  Imágenes de stock (Pexels), con los autores de los clips enlazados en github.com/samanjmq-max/logistica-en-1-minuto.

