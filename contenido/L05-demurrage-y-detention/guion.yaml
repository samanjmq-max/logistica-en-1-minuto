descripcion: |
  📘 Guía práctica + planilla para comparar cotizaciones: https://go.hotmart.com/M108343404O?dp=1

  Pensaste que te pasaste 4 días y eran USD 400, y te llega una factura de USD 1.370. En este video: qué son el demurrage y el detention (y el formato combinado), cuándo arranca y cuándo para cada reloj, cuánto cuesta un día de más con tarifas reales de Uruguay, la cuenta completa de un contenedor en Montevideo, cómo negociar los días libres antes de embarcar, qué hacer cuando llega el barco y los 7 errores más caros.

  Datos clave:
  · Demurrage: contenedor lleno dentro de la terminal (en importación, desde la descarga hasta la salida). Detention: contenedor afuera, hasta que entra VACÍO al depósito que indica la naviera. Combinado: un solo reloj, desde la descarga hasta la devolución del vacío (términos de Maersk).
  · Hapag-Lloyd, importación Uruguay, vigente desde el 1/1/2026, demurrage y detention combinados, días calendario (el día del evento cuenta entero): seco de 20/40 pies, 5 días libres; días 6 a 10, USD 80/100 por día; desde el día 11, USD 105/145. Refrigerado: 3 días libres; días 4 a 9, USD 255; después USD 315. El almacenaje lo cobra la terminal aparte.
  · Maersk, importación Uruguay (su página, valores desde el 1/1/2024): seco 7 días libres combinados; 40 pies USD 90 (días 8 a 17), 130 (18 a 21) y 150 (desde el 22). Reloj desde la descarga hasta la devolución del vacío. Almacenaje aparte, de la terminal.
  · Con 14 días de más, el promedio por contenedor era USD 2.478 en Nueva York y USD 584 en Hamburgo (Container xChange, 2023).
  · Hapag-Lloyd en EE. UU. vende hasta 10 días extra de detention con descuento, que se pagan antes del arribo y no se devuelven.
  · EE. UU. (regla de la FMC, 46 CFR 541, vigente desde el 28/5/2024): la factura de demurrage o detention se emite dentro de los 30 días, el que recibe la factura tiene al menos 30 días para reclamar y, si falta un dato obligatorio, no está obligado a pagar.

  La cuenta del ejemplo (seco de 40 pies, Hapag-Lloyd Uruguay): sale del puerto el día 9 y el vacío vuelve el día 16 → días 6 a 10: 5 × USD 100 = 500; días 11 a 16: 6 × USD 145 = 870; total USD 1.370, más el almacenaje de la terminal. Con 14 días libres pactados (y el mismo primer tramo) habría pagado USD 200. Las fechas son supuestas; la tarifa es la publicada.

  Ojo: cada naviera, puerto y contrato tiene su tabla, y las tarifas cambian. Confirmá la tuya por escrito con tu naviera o tu forwarder antes de embarcar.

  Fuentes: tarifa de demurrage y detention de importación de Hapag-Lloyd para Uruguay (enero de 2026), página de importación de Maersk Uruguay, términos de detention y demurrage de Maersk, benchmark de Container xChange 2023, días extra de Hapag-Lloyd (EE. UU.) y regla final de la Comisión Marítima Federal de EE. UU. (FMC).

